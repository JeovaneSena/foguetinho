<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fdcff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foguetinho">
<link rel="apple-touch-icon" href="assets/logo/icone-180.png">
<title>Foguetinho Educativo</title>
<link rel="icon" href="assets/logo/logo-icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#2b1d4a;--rosa:#d42a74;--amarelo:#ffc83d;--ceu1:#8fdcff;--ceu2:#fff3f9;--card:#ffffff;--suave:#f4ecff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--tinta);background:linear-gradient(180deg,var(--ceu1),var(--ceu2) 70%);min-height:100vh;min-height:100dvh}
button{font-family:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tela{display:none;min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));flex-direction:column;align-items:center;gap:18px}
.tela.on{display:flex}
.centro{justify-content:center}
.logo{width:min(300px,64vw);filter:drop-shadow(0 10px 18px #6b2fb340)}
h2{margin:0;font-size:clamp(28px,4vw,40px);line-height:1}
.grande{font-size:26px;font-weight:800;border:0;border-radius:999px;padding:14px 34px;background:var(--rosa);color:#fff;cursor:pointer;box-shadow:0 6px 0 #9e1c55;transition:transform .08s}
.grande:active{transform:translateY(4px);box-shadow:0 2px 0 #9e1c55}
.grande.am{background:var(--amarelo);color:var(--tinta);box-shadow:0 6px 0 #d29a12}
.grande.br{background:#fff;color:var(--tinta);box-shadow:0 6px 0 #c9bfe0}
.menu{display:grid;gap:16px;width:min(360px,90vw)}
.menu .grande{display:flex;align-items:center;gap:14px;justify-content:center}
.topo{display:flex;width:100%;max-width:1100px;align-items:center;justify-content:space-between;gap:12px}
.selo{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:62px;height:62px;border-radius:14px;background:var(--amarelo);font:800 30px/56px "Baloo 2",sans-serif;text-align:center;border:4px solid #fff;box-shadow:0 4px 10px #0002}
.idade{background:var(--card);border-radius:28px;padding:24px;display:grid;gap:14px;justify-items:center;box-shadow:0 10px 30px #6b2fb322;width:min(420px,92vw)}
.idade label{font-size:26px;font-weight:700}
.idade input{width:120px;font:800 40px "Baloo 2",sans-serif;text-align:center;border:4px solid var(--suave);border-radius:18px;padding:4px;color:var(--tinta)}
.aviso{font-size:22px;text-align:center;min-height:1.3em;margin:0;color:#c92f74;font-weight:700}
.estudio{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:1100px}
.palco{background:radial-gradient(circle at 50% 40%,#fff,#ffe4f1);border-radius:32px;box-shadow:0 10px 30px #6b2fb322;display:grid;place-items:center}
.palco.b{width:min(340px,86vw);aspect-ratio:3/5}
.palco.b svg{width:78%;height:auto}
.palco.c{width:min(720px,94vw);aspect-ratio:7/4;background:radial-gradient(circle at 50% 30%,#fff,#dff4ff)}
.palco.c svg{width:100%}
.painel{background:var(--card);border-radius:28px;padding:16px;display:grid;gap:12px;width:min(460px,94vw);box-shadow:0 10px 30px #6b2fb322}
.abas{display:flex;gap:8px}
.abas button{flex:1;font-size:20px;font-weight:800;border:0;border-radius:16px;padding:8px;background:var(--suave);cursor:pointer}
.abas button.on{background:var(--rosa);color:#fff}
.opc{display:grid;gap:6px;padding:8px 10px;border-radius:18px;background:#fbf8ff}
.lin{display:flex;align-items:center;gap:10px}
.lin b{width:92px;font-size:18px}
.lin span{flex:1;text-align:center;font-size:20px;font-weight:700}
.seta{width:46px;height:46px;border-radius:50%;border:0;background:var(--amarelo);font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #d29a12}
.seta:active{transform:translateY(2px);box-shadow:none}
.cores{display:flex;flex-wrap:wrap;gap:7px;padding-left:102px}
.cor{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d9cfee;cursor:pointer;padding:0}
.cor.on{box-shadow:0 0 0 3px var(--rosa);transform:scale(1.12)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding:4px}
.mini{border:3px solid transparent;border-radius:16px;background:#fbf8ff;padding:4px;cursor:pointer;display:grid;gap:0;justify-items:center}
.mini svg{width:100%;height:auto}
.mini span{font-size:14px;font-weight:700;line-height:1.1;text-align:center}
.mini.on{border-color:var(--rosa);background:#fff0f7}
#mundo{width:100%;max-width:1400px;height:min(62vh,60vw);min-height:240px;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #6b2fb333;background:#7fd3ff}
#mundo svg{display:block;width:100%;height:100%;touch-action:none}
.controle{display:flex;gap:24px;align-items:center}
.controle .seta{width:84px;height:84px;font-size:38px}
#chegou{font-size:clamp(30px,5vw,54px);font-weight:800;letter-spacing:.06em;min-height:1.2em;color:var(--tinta);text-align:center}
#chegou small{display:block;font-size:18px;letter-spacing:0;font-weight:600}
@media (max-width:700px){
  .tela{gap:12px}
  .topo .grande{font-size:18px;padding:8px 16px}
  .topo h2{font-size:24px}
  .estudio{gap:12px}
  .palco.b{position:sticky;top:0;z-index:2;width:100%;aspect-ratio:auto;height:36vh;height:36dvh;border-radius:0 0 28px 28px}
  .palco.b svg{width:auto;height:94%}
  .painel{width:100%;padding:12px;border-radius:22px}
  .cores{padding-left:0;gap:9px}
  .cor{width:38px;height:38px}
  .lin b{width:70px;font-size:16px}
  .lin span{font-size:17px}
  .seta{width:50px;height:50px}
  #mundo{height:56vh;height:56dvh;border-radius:18px}
  .controle{gap:40px}
  .controle .seta{width:96px;height:96px}
}
@media (orientation:landscape) and (max-height:500px){
  #cidade .topo{position:fixed;top:8px;left:8px;width:auto;z-index:3}
  #cidade .topo h2,#cidade .topo span{display:none}
  #mundo{position:fixed;inset:0;height:100%;max-width:none;border-radius:0}
  #cidade .controle{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;justify-content:space-between;padding:0 24px;z-index:3}
  #chegou{position:fixed;top:8px;left:0;right:0;z-index:2;color:#fff;text-shadow:0 2px 6px #0008;pointer-events:none}
}
</style></head><body>

<div id="idade" class="tela centro on">
  <img class="logo" src="assets/logo/logo-colorido.svg" alt="Foguetinho Educativo">
  <div class="idade">
    <label for="anos">Quantos anos você tem?</label>
    <input id="anos" type="number" min="1" max="120" inputmode="numeric">
    <button class="grande" onclick="entrar()">Entrar</button>
    <p id="aviso" class="aviso" role="alert"></p>
  </div>
</div>

<div id="inicio" class="tela centro">
  <div class="selo" title="Classificação: 7 anos ou mais">7+</div>
  <img class="logo" src="assets/logo/logo-colorido.svg" alt="Foguetinho Educativo">
  <div class="menu">
    <button class="grande" onclick="ir('boneco')">👧 Criar bonecos</button>
    <button class="grande am" onclick="ir('carro')">🚗 Escolher carro</button>
    <button class="grande br" onclick="ir('cidade')">🏙️ Passear na cidade</button>
  </div>
</div>

<div id="boneco" class="tela">
  <div class="topo"><button class="grande br" onclick="ir('inicio')">◀ Voltar</button><h2>Meus bonecos</h2><span></span></div>
  <div class="estudio">
    <div class="palco b"><svg id="svgBoneco" viewBox="0 0 200 400"></svg></div>
    <div class="painel">
      <div class="abas" id="abas"></div>
      <div id="opcBoneco" style="display:grid;gap:10px"></div>
    </div>
  </div>
</div>

<div id="carro" class="tela">
  <div class="topo"><button class="grande br" onclick="ir('inicio')">◀ Voltar</button><h2>Meu carro</h2><span></span></div>
  <div class="palco c"><svg id="svgCarro" viewBox="0 0 700 400"></svg></div>
  <div class="painel" id="opcCarro"></div>
  <button class="grande" onclick="ir('cidade')">Passear! 🏙️</button>
</div>

<div id="cidade" class="tela">
  <div class="topo"><button class="grande br" onclick="ir('inicio')">◀ Voltar</button><h2>Cidade</h2><span></span></div>
  <div id="mundo"><svg id="svgCidade" viewBox="0 0 1200 700" preserveAspectRatio="xMinYMid slice"><g id="cidadeFundo"></g><g id="carroNaRua"></g></svg></div>
  <div id="chegou"><small>Use as setas para dirigir</small></div>
  <div class="controle">
    <button class="seta" id="esq" aria-label="Para a esquerda">◀</button>
    <button class="seta" id="dir" aria-label="Para a direita">▶</button>
  </div>
</div>

<script src="arte.js"></script>
<script>
const A = window.ARTE;
const novo = (i) => ({pele:[0,2,4][i], olhos:i%4, cabelo:[0,2,1][i], corCabelo:[1,0,3][i], cima:[4,0,1][i], corCima:[0,2,1][i],
  baixo:[0,1,3][i], corBaixo:[5,7,0][i], sapato:[1,0,2][i], corSapato:[0,5,1][i], acessorio:[2,3,1][i]});
let E = {bonecos:[novo(0),novo(1),novo(2)], atual:0, carro:{tipo:0, cor:0}};
try { const s = JSON.parse(localStorage.getItem('foguetinho')); if (s && s.bonecos && s.bonecos.length === 3) E = Object.assign(E, s); } catch (e) {}
const salvar = () => { try { localStorage.setItem('foguetinho', JSON.stringify(E)); } catch (e) {} };

// ---------- idade ----------
// shortcut: idade digitada à mão, qualquer um pode mentir; serve só para o teste em casa
function entrar(){
  const n = parseInt(document.getElementById('anos').value, 10), av = document.getElementById('aviso');
  if (!(n >= 1)) av.textContent = 'Digite sua idade.';
  else if (n < 7) av.textContent = 'Este jogo é para quem tem 7 anos ou mais. Volte quando crescer! 🚀';
  else { av.textContent = ''; ir('inicio'); }
}
document.getElementById('anos').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

// ---------- telas ----------
function ir(t){
  document.querySelectorAll('.tela').forEach(e => e.classList.toggle('on', e.id === t));
  if (t === 'boneco') telaBoneco();
  if (t === 'carro') telaCarro();
  if (t === 'cidade') telaCidade(); else parar();
  window.scrollTo(0, 0);
}

function linha(rotulo, nomes, valor, mudar, cores, corValor, mudarCor){
  const box = document.createElement('div'); box.className = 'opc';
  const l = document.createElement('div'); l.className = 'lin';
  const n = nomes.length;
  l.innerHTML = `<b>${rotulo}</b>`;
  if (n > 1) {
    const a = document.createElement('button'); a.className = 'seta'; a.textContent = '◀'; a.setAttribute('aria-label', rotulo + ' anterior');
    const s = document.createElement('span'); s.textContent = nomes[valor];
    const b = document.createElement('button'); b.className = 'seta'; b.textContent = '▶'; b.setAttribute('aria-label', rotulo + ' próximo');
    a.onclick = () => mudar((valor + n - 1) % n); b.onclick = () => mudar((valor + 1) % n);
    l.append(a, s, b);
  }
  box.appendChild(l);
  if (cores) {
    const c = document.createElement('div'); c.className = 'cores';
    cores.forEach((cor, i) => {
      const k = document.createElement('button'); k.className = 'cor' + (i === corValor ? ' on' : '');
      k.style.background = cor; k.setAttribute('aria-label', rotulo + ' cor ' + (i + 1)); k.onclick = () => mudarCor(i);
      c.appendChild(k);
    });
    box.appendChild(c);
  }
  return box;
}

// ---------- boneco ----------
function telaBoneco(){
  const d = E.bonecos[E.atual];
  document.getElementById('svgBoneco').innerHTML = A.boneco(d);
  const abas = document.getElementById('abas'); abas.innerHTML = '';
  [0,1,2].forEach(i => { const b = document.createElement('button'); b.textContent = 'Boneco ' + (i + 1);
    b.className = i === E.atual ? 'on' : ''; b.onclick = () => { E.atual = i; salvar(); telaBoneco(); }; abas.appendChild(b); });
  const set = (k) => v => { d[k] = v; salvar(); telaBoneco(); };
  const o = document.getElementById('opcBoneco'); o.innerHTML = '';
  o.append(
    linha('Pele', [''], 0, null, A.CORES.pele, d.pele, set('pele')),
    linha('Olhos', [''], 0, null, A.CORES.olhos, d.olhos, set('olhos')),
    linha('Cabelo', A.CABELOS, d.cabelo, set('cabelo'), A.CORES.cabelo, d.corCabelo, set('corCabelo')),
    linha('Blusa', A.CIMA, d.cima, set('cima'), A.CORES.roupa, d.corCima, set('corCima')),
    linha('Saia/Calça', A.BAIXO, d.baixo, set('baixo'), A.CORES.roupa, d.corBaixo, set('corBaixo')),
    linha('Sapato', A.SAPATOS, d.sapato, set('sapato'), A.CORES.roupa, d.corSapato, set('corSapato')),
    linha('Enfeite', A.ACESS, d.acessorio, set('acessorio'))
  );
}

// ---------- carro ----------
const desenhoCarro = () => A.carro(E.carro.tipo, E.carro.cor, E.bonecos.map(A.boneco));
function telaCarro(){
  document.getElementById('svgCarro').innerHTML = desenhoCarro();
  const o = document.getElementById('opcCarro'); o.innerHTML = '';
  o.append(linha('Modelo', A.CARROS, E.carro.tipo, v => { E.carro.tipo = v; salvar(); telaCarro(); },
    A.CORES.carro, E.carro.cor, v => { E.carro.cor = v; salvar(); telaCarro(); }));
  // galeria com todos os carros na cor escolhida
  const g = document.createElement('div'); g.className = 'galeria';
  A.CARROS.forEach((nome, i) => {
    const b = document.createElement('button'); b.className = 'mini' + (i === E.carro.tipo ? ' on' : '');
    b.innerHTML = `<svg viewBox="40 40 640 340">${A.carro(i, E.carro.cor, [null, null, null])}</svg><span>${nome}</span>`;
    b.onclick = () => { E.carro.tipo = i; salvar(); telaCarro(); };
    g.appendChild(b);
  });
  o.appendChild(g);
  const sel = g.querySelector('.on'); if (sel) sel.scrollIntoView({block: 'nearest', inline: 'center'});
}

// ---------- cidade ----------
const ESC = 0.55, LARG = 3400, CHAO_CARRO = 652;
let x = 60, dirAtual = 0, virado = false, loop = null, ultimo = 0, lugarAtual = null;
const svgC = document.getElementById('svgCidade');
document.getElementById('cidadeFundo').innerHTML = A.cidade();

function telaCidade(){
  document.getElementById('carroNaRua').innerHTML = `<g id="carroG">${desenhoCarro()}</g>`;
  posicionar(); if (!loop) { ultimo = performance.now(); loop = requestAnimationFrame(passo); }
}
function parar(){ if (loop) cancelAnimationFrame(loop); loop = null; dirAtual = 0; }
function posicionar(){
  const g = document.getElementById('carroG'); if (!g) return;
  const ty = CHAO_CARRO - 356 * ESC, w = 700 * ESC;
  g.setAttribute('transform', virado ? `translate(${x + w} ${ty}) scale(${-ESC} ${ESC})` : `translate(${x} ${ty}) scale(${ESC})`);
  const r = svgC.getBoundingClientRect(), vw = r.height ? 700 * r.width / r.height : 1200;
  const cam = Math.max(0, Math.min(LARG - vw, x + w / 2 - vw / 2));
  svgC.setAttribute('viewBox', `${cam} 0 ${vw} 700`);
}
function passo(t){
  const dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
  if (dirAtual) { x = Math.max(0, Math.min(LARG - 700 * ESC, x + dirAtual * 420 * dt)); virado = dirAtual < 0; posicionar(); verLugar(); }
  loop = requestAnimationFrame(passo);
}
function verLugar(){
  const meio = x + 350 * ESC;
  const l = A.LUGARES.find(l => Math.abs(l.x - meio) < 140);
  if (l === lugarAtual) return;
  lugarAtual = l;
  document.getElementById('chegou').innerHTML = l ? `${l.nome}<small>Você chegou! Leia comigo: ${l.nome.toLowerCase()}</small>` : '<small>Continue dirigindo…</small>';
  if (l) falar(l.nome.toLowerCase());
}
// iPhone só libera a voz depois de um toque; o primeiro toque nas setas destrava
let vozOk = false;
function destravarVoz(){ if (vozOk) return; vozOk = true; try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
function falar(txt){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'pt-BR'; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {}
}
const segurar = (id, d) => {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); destravarVoz(); try { b.setPointerCapture(e.pointerId); } catch (_) {} dirAtual = d; }, off = () => { if (dirAtual === d) dirAtual = 0; };
  b.addEventListener('pointerdown', on); ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, off));
};
segurar('esq', -1); segurar('dir', 1);
addEventListener('keydown', e => { if (!loop) return; if (e.key === 'ArrowLeft') dirAtual = -1; if (e.key === 'ArrowRight') dirAtual = 1; });
addEventListener('keyup', e => { if ((e.key === 'ArrowLeft' && dirAtual < 0) || (e.key === 'ArrowRight' && dirAtual > 0)) dirAtual = 0; });
addEventListener('resize', posicionar);
</script>
</body></html>
